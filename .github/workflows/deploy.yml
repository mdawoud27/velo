name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - closed

jobs:
  build-and-push:
    if: github.event.pull_request.merged == true
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract repository name
        id: repo
        run: |
          REPO_NAME=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set image name and tags
        id: image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.repo.outputs.repo_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          SHA_TAG="${MERGE_SHA:0:7}"

          if [[ "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
            VERSION_TAG="$VERSION"
            LATEST_TAG="latest"
            DEPLOYMENT_URL="https://velo-app.up.railway.app"
            DEPLOYMENT_TARGET="Production"
            RAILWAY_SERVICE="velo"
          else
            VERSION_TAG="$VERSION-dev"
            LATEST_TAG="dev-latest"
            DEPLOYMENT_URL="https://velo-app.up.railway.app"
            DEPLOYMENT_TARGET="Development"
            RAILWAY_SERVICE="velo"
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "deployment_target=$DEPLOYMENT_TARGET" >> "$GITHUB_OUTPUT"
          echo "railway_service=$RAILWAY_SERVICE" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.version_tag }}
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.latest_tag }}
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Trigger Railway redeploy
        id: railway_redeploy
        if: false
        run: |
          npm i -g @railway/cli
          railway redeploy -s "${{ steps.image.outputs.railway_service }}" -y
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify Discord Success
        if: always() && steps.build.outcome == 'success'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOYMENT_DISCORD_WEBHOOK }}
        run: |
          PAYLOAD=$(jq -n \
            --arg target "${{ steps.image.outputs.deployment_target }}" \
            --arg url "${{ steps.image.outputs.deployment_url }}" \
            --arg image "${{ steps.image.outputs.image }}" \
            --arg version "${{ steps.image.outputs.version_tag }}" \
            --arg branch "${{ github.event.pull_request.base.ref }}" \
            --arg author "${{ github.event.pull_request.user.login }}" \
            --arg pr "${{ github.event.pull_request.html_url }}" \
            '{content: "✅ **\($target) Version Updated Successfully**\n[View Deployment](\($url))\nRepository: `\($image)`\nVersion: `\($version)`\nBranch: `\($branch)`\nAuthor: \($author)\nPR: \($pr)"}')
          curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

      - name: Notify Discord Failure
        if: always() && steps.build.outcome != 'success'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOYMENT_DISCORD_WEBHOOK }}
        run: |
          PAYLOAD=$(jq -n \
            --arg target "${{ steps.image.outputs.deployment_target }}" \
            --arg image "${{ steps.image.outputs.image }}" \
            --arg branch "${{ github.event.pull_request.base.ref }}" \
            --arg author "${{ github.event.pull_request.user.login }}" \
            --arg pr "${{ github.event.pull_request.html_url }}" \
            '{content: "❌ **\($target) Version Update Failed**\nReason: Docker build/push or Railway redeploy failed.\nRepository: `\($image)`\nBranch: `\($branch)`\nAuthor: \($author)\nPR: \($pr)"}')
          curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
