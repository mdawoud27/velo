name: Code Style & Quality Checks
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/velo_test'
  FRONTEND_URL: 'http://localhost:3000'
  JWT_ACCESS_SECRET: 'test-jwt-access-secret-for-ci'
  JWT_ACCESS_EXPIRES_IN: '15m'
  JWT_REFRESH_SECRET: 'test-jwt-refresh-secret-for-ci'
  JWT_REFRESH_EXPIRES_IN: '7d'
  GROQ_API_KEY: 'test-groq-api-key'
  STRIPE_SECRET_KEY: 'sk_test_dummykeyfortesting'
  STRIPE_WEBHOOK_SECRET: 'whsec_test_dummysecretforci'
  STRIPE_PRO_PRICE_ID: 'price_test_pro_dummy'
  STRIPE_BUSINESS_PRICE_ID: 'price_test_business_dummy'
  SMTP_HOST: 'localhost'
  SMTP_PORT: '1025'
  SMTP_SECURE: 'false'
  SMTP_USER: 'test-smtp-user'
  SMTP_PASS: 'test-smtp-pass'
  REDIS_URL: 'redis://localhost:6379'

jobs:
  format-check:
    if: github.event.pull_request.draft == false
    name: Code Formatting (Prettier)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Run Formatter Check
        run: pnpm run format:check

  lint-check:
    if: github.event.pull_request.draft == false
    name: Code Linting (ESLint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Run Linter Check
        run: pnpm run lint:check

  unit-tests:
    if: github.event.pull_request.draft == false
    needs: [format-check, lint-check]
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Run Unit Tests with Coverage
        run: pnpm run test:cov

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info
          filter-changed-files: true
          delete-old-comments: true
          title: Unit Tests Coverage Report

  e2e-tests:
    if: github.event.pull_request.draft == false
    needs: unit-tests
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Push Database Schema
        run: pnpm prisma db push --accept-data-loss

      - name: Run E2E Tests
        run: pnpm run test:e2e
