services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: velo_app_dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
