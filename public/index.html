<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velo API</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: oklch(0.14 0.01 264);
        color: oklch(0.98 0 0);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .container {
        width: 100%;
        max-width: 720px;
        background: oklch(0.18 0.01 264);
        border: 1px solid oklch(0.25 0.01 264);
        border-radius: 18px;
        padding: 48px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 16px;
        background: oklch(0.45 0.15 264);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 700;
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 40px;
        font-weight: 700;

        background: linear-gradient(135deg, oklch(0.98 0 0), oklch(0.65 0.15 264));

        background-clip: text;
        -webkit-background-clip: text;

        color: transparent;
        -webkit-text-fill-color: transparent;
      }

      .version {
        display: inline-block;
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 600;
        color: oklch(0.85 0.1 264);
        background: oklch(0.25 0.04 264);
        border: 1px solid oklch(0.35 0.06 264);
        padding: 4px 14px;
        border-radius: 999px;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      .subtitle {
        color: oklch(0.72 0.01 264);
        font-size: 18px;
        margin-bottom: 36px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: oklch(0.55 0.15 145);
        color: white;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 600;
        margin-bottom: 40px;
      }

      .status::before {
        content: '';
        width: 10px;
        height: 10px;
        background: white;
        border-radius: 50%;
      }

      .actions {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 14px 24px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
      }

      .btn-primary {
        background: oklch(0.45 0.15 264);
        color: white;
      }

      .btn-primary:hover {
        background: oklch(0.5 0.15 264);
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: oklch(0.22 0.01 264);
        color: white;
        border: 1px solid oklch(0.25 0.01 264);
      }

      .btn-secondary:hover {
        background: oklch(0.28 0.01 264);
      }

      footer {
        margin-top: 40px;
        color: oklch(0.65 0.01 264);
        font-size: 14px;
      }

      @media (max-width: 600px) {
        .container {
          padding: 32px 24px;
        }

        h1 {
          font-size: 32px;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }

      .footer {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid oklch(0.25 0.01 264);
        text-align: center;
        color: oklch(0.65 0.01 264);
        font-size: 14px;
      }

      .footer-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .github-icon {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .footer-link {
        color: oklch(0.65 0.01 264);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .footer-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <div class="logo">V</div>

      <div class="title-row">
        <h1>Velo API</h1>
        <span class="version">v0.10.11</span>
      </div>

      <p class="subtitle">Production-grade project management API built with NestJS.</p>

      <div class="status">API Online</div>

      <div class="actions">
        <a class="btn btn-primary" href="/api-docs"> API Documentation </a>

        <a class="btn btn-secondary" href="/health"> Health Check </a>
      </div>

      <footer class="footer">
        <p class="footer-content">
          <svg height="18" width="18" viewBox="0 0 16 16" class="github-icon" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            />
          </svg>

          <span>
            Built by
            <a
              href="https://github.com/mdawoud27"
              target="_blank"
              rel="noopener noreferrer"
              class="footer-link"
            >
              dawoud
            </a>
          </span>
        </p>
      </footer>
    </main>
  </body>
</html>
