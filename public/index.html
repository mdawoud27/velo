<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velo API</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: oklch(0.14 0.01 264);
        color: oklch(0.98 0 0);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .container {
        width: 100%;
        max-width: 720px;
        background: oklch(0.18 0.01 264);
        border: 1px solid oklch(0.25 0.01 264);
        border-radius: 18px;
        padding: 48px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 16px;
        background: oklch(0.45 0.15 264);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 700;
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 40px;
        font-weight: 700;

        background: linear-gradient(135deg, oklch(0.98 0 0), oklch(0.65 0.15 264));

        background-clip: text;
        -webkit-background-clip: text;

        color: transparent;
        -webkit-text-fill-color: transparent;
      }

      .version {
        display: inline-block;
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 600;
        color: oklch(0.85 0.1 264);
        background: oklch(0.25 0.04 264);
        border: 1px solid oklch(0.35 0.06 264);
        padding: 4px 14px;
        border-radius: 999px;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      .subtitle {
        color: oklch(0.72 0.01 264);
        font-size: 18px;
        margin-bottom: 36px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: oklch(0.55 0.15 145);
        color: white;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 600;
        margin-bottom: 40px;
      }

      .status::before {
        content: '';
        width: 10px;
        height: 10px;
        background: white;
        border-radius: 50%;
      }

      .actions {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 14px 24px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
      }

      .btn-primary {
        background: oklch(0.45 0.15 264);
        color: white;
      }

      .btn-primary:hover {
        background: oklch(0.5 0.15 264);
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: oklch(0.22 0.01 264);
        color: white;
        border: 1px solid oklch(0.25 0.01 264);
      }

      .btn-secondary:hover {
        background: oklch(0.28 0.01 264);
      }

      footer {
        margin-top: 40px;
        color: oklch(0.65 0.01 264);
        font-size: 14px;
      }

      @media (max-width: 600px) {
        .container {
          padding: 32px 24px;
        }

        h1 {
          font-size: 32px;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }

      .footer {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid oklch(0.25 0.01 264);
        text-align: center;
        color: oklch(0.65 0.01 264);
        font-size: 14px;
      }

      .footer-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .github-icon {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .footer-link {
        color: oklch(0.65 0.01 264);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .footer-link:hover {
        text-decoration: underline;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 36px 0 20px;
        color: oklch(0.55 0.01 264);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: oklch(0.25 0.01 264);
      }

      .oauth-wrapper {
        display: inline-flex;
        flex-direction: column;
        align-items: stretch;
      }

      .oauth-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn-oauth {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 22px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        background: oklch(0.22 0.01 264);
        color: white;
        border: 1px solid oklch(0.28 0.01 264);
        cursor: pointer;
        transition: 0.2s;
        font-family: 'Inter', sans-serif;
      }

      .btn-oauth:hover:not(:disabled) {
        background: oklch(0.28 0.01 264);
        transform: translateY(-2px);
      }

      .btn-oauth:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .btn-oauth svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      .oauth-result {
        display: none;
        margin-top: 20px;
        padding: 14px 18px;
        border-radius: 10px;
        font-size: 14px;
        text-align: left;
        width: 100%;
      }

      .oauth-result.show {
        display: block;
      }

      .oauth-result.success {
        background: oklch(0.25 0.08 145 / 0.35);
        border: 1px solid oklch(0.55 0.15 145 / 0.5);
        color: oklch(0.9 0.05 145);
      }

      .oauth-result.error {
        background: oklch(0.25 0.08 25 / 0.35);
        border: 1px solid oklch(0.55 0.15 25 / 0.5);
        color: oklch(0.9 0.05 25);
      }

      .oauth-result strong {
        display: block;
        margin-bottom: 2px;
        color: inherit;
      }

      .oauth-result span {
        opacity: 0.85;
        word-break: break-all;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <div class="logo">V</div>

      <div class="title-row">
        <h1>Velo API</h1>
        <span class="version">v{{VERSION}}</span>
      </div>

      <p class="subtitle">Production-grade project management API built with NestJS.</p>

      <div class="status">API Online</div>

      <div class="actions">
        <a class="btn btn-primary" href="/api-docs"> API Documentation </a>

        <a class="btn btn-secondary" href="/health"> Health Check </a>
      </div>

      <div class="divider">Quick test login</div>

      <div class="oauth-wrapper">
        <div class="oauth-actions">
          <button class="btn-oauth" id="google-login">
            <svg viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.54 5.54 0 0 1-2.4 3.63v3h3.87c2.27-2.09 3.58-5.17 3.58-8.82z"
              />
              <path
                fill="#34A853"
                d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.95H1.27v3.11A12 12 0 0 0 12 24z"
              />
              <path
                fill="#FBBC05"
                d="M5.27 14.29A7.2 7.2 0 0 1 4.89 12c0-.8.14-1.57.38-2.29V6.6H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.4l4-3.11z"
              />
              <path
                fill="#EA4335"
                d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.6l4 3.11C6.22 6.86 8.87 4.75 12 4.75z"
              />
            </svg>
            <span>Continue with Google</span>
          </button>

          <button class="btn-oauth" id="github-login">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
              />
            </svg>
            <span>Continue with GitHub</span>
          </button>
        </div>

        <div class="oauth-result" id="oauth-result"></div>
      </div>

      <footer class="footer">
        <p class="footer-content">
          <svg height="18" width="18" viewBox="0 0 16 16" class="github-icon" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            />
          </svg>

          <span>
            Built by
            <a
              href="https://github.com/mdawoud27"
              target="_blank"
              rel="noopener noreferrer"
              class="footer-link"
            >
              dawoud
            </a>
          </span>
        </p>
      </footer>
    </main>

    <script src="./oauth.js"></script>
  </body>
</html>
